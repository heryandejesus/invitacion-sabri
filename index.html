<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Cumpleaños - Sabrina</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="card" id="invite-card">
        <img src="https://ui-avatars.com/api/?name=Sabrina&background=ff6b81&color=fff&size=150" alt="Foto de Sabrina" class="profile-img" id="sabrina-img">
        
        <h1>¡Hola! Soy Sabrina</h1>
        <p>Te invito a mi cumpleaños. ¡Falta muy poco!</p>

        <div class="countdown" id="countdown">
            <div><span id="days">00</span><small>Días</small></div>
            <div><span id="hours">00</span><small>Hrs</small></div>
            <div><span id="minutes">00</span><small>Min</small></div>
            <div><span id="seconds">00</span><small>Seg</small></div>
        </div>

        <p class="details">
           <strong>📅 14 de Marzo | ⏰ 20:00 hs</strong><br>
           ¿Cuento contigo?
        </p>
        
        <div class="buttons" id="button-container">
            <button class="btn-yes" onclick="responder('si')">¡Sí!</button>
            <button class="btn-maybe" onclick="responder('talvez')">Tal vez</button>
            <button class="btn-no" onclick="responder('no')">No podré</button>
        </div>

        <div id="result-si" class="result-message">
            <img src="https://media.tenor.com/bQON0_T-X9EAAAAi/cat-dance.gif" alt="Gato feliz bailando" class="cat-gif">
            <p>¡Genial! Nos vemos para celebrar. 🎉</p>
        </div>

        <div id="result-talvez" class="result-message">
            <img src="https://media.tenor.com/8a3yE1Zk6y0AAAAi/cat-loading.gif" alt="Gato pensando" class="cat-gif">
            <p>Mmm... avísame pronto, ¡no me dejes en ascuas! 🐈</p>
        </div>

        <div id="result-no" class="result-message">
            <img src="https://media.tenor.com/xZ411mD8G-QAAAAi/cat-crying.gif" alt="Gato triste llorando" class="cat-gif">
            <p>¡Buuuh! Te extrañaré muchísimo. 🥺</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
